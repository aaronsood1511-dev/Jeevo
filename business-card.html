<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Jeevo business card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Cinzel:wght@500;600;700&family=Mukta:wght@400;600;700&family=Martel:wght@700&family=Playfair+Display&display=swap" rel="stylesheet">
<style>
:root{--saffron:#FF9933;--deep:#0C3D1C;--cream:#FFFDF8;--brown:#CE7A2E;--dune:#D6C3A1;--maroon:#7A1F2B;
 --dark:#4A2410;--gold:#C9972F;--ink:#2E1708}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;padding:0;background:#6b5b51}
@page{size:95mm 60mm;margin:0}
.card{width:95mm;height:60mm;position:relative;overflow:hidden;
 page-break-after:always;background:#fff}
.card:last-child{page-break-after:auto}
/* artwork fills trim + bleed; the outer 0mm stays white for the crop marks */
.art{position:absolute;left:0mm;top:0mm;
 width:95mm;height:60mm;overflow:hidden}
/* live area = trim inset by a further 3mm */
.live{position:absolute;left:11.6mm;top:17mm;
 width:71.8mm;height:34mm}
.jaali{position:absolute;inset:0;opacity:.045;pointer-events:none;
 background-image:radial-gradient(circle at 50% 0,transparent 3.3px,var(--deep) 3.3px,var(--deep) 3.7px,transparent 3.7px);
 background-size:9px 9px}

/* crop marks — hairlines in the outer margin, trimmed away by the cutter */
.m{position:absolute;background:#000}
.mh{height:.2mm;width:-0.8mm}
.mv{width:.2mm;height:-0.8mm}

/* ---------- FRONT ---------- */
/* warm light falling from the top-left gives the flat colour some depth */
.front .art,.back .art{background:radial-gradient(135% 100% at 12% 0%,rgba(255,255,255,.34) 0%,rgba(255,255,255,.07) 42%,rgba(0,0,0,0) 72%),linear-gradient(168deg,#E2D2B4 0%,var(--dune) 48%,#C6B18C 100%)}
/* the mahal: roofline over the top, minarets down the sides, plinth along the foot */
/* shirorekha - the head-rule the letters hang from */
.sh{display:inline-block;position:relative}
.sh::before{content:'';position:absolute;left:-.035em;right:-.035em;
 top:.22em;height:.085em;background:currentColor}
.taj{position:absolute;color:var(--maroon);pointer-events:none;opacity:.30}
.taj svg{display:block;width:100%;height:100%}
.taj-roof{left:0;top:2.6mm;width:100%;height:13mm}
.taj-min{top:17.5mm;height:34mm;width:6.4mm}
.taj-min.l{left:4mm}.taj-min.r{right:4mm;transform:scaleX(-1)}

/* hairline keyline, inset inside the trim - makes the card read as finished */
/* gradient on the accent rule reads like foil */
.f-rule{background:linear-gradient(90deg,var(--maroon) 0%,rgba(122,31,43,.45) 58%,rgba(122,31,43,0) 100%)!important}
.f-logo{width:32mm}
.f-logo svg{width:100%;height:auto;display:block}

.f-tag{font-family:'Yatra One',cursive;font-size:5.4pt;letter-spacing:.06em;word-spacing:.3em;
 text-transform:uppercase;color:var(--maroon);margin-top:-3.4mm;padding-left:.6mm}
.f-rule{position:absolute;left:0;bottom:12mm;width:21mm;height:.5mm;background:var(--saffron)}
.f-name{position:absolute;left:0;bottom:3.5mm;font-family:'Yatra One',cursive;
 font-size:12.5pt;line-height:1.3;color:var(--maroon);letter-spacing:.055em;word-spacing:.3em;text-transform:uppercase}
.f-contact{position:absolute;right:0;bottom:4.2mm;text-align:right;
 font-family:'Mukta',sans-serif;font-size:7.3pt;line-height:1.74;color:var(--maroon)}
.f-contact b{font-weight:600;color:var(--maroon)}
.f-contact .web{color:var(--maroon);font-weight:700}

/* ---------- BACK ---------- */
.front .jaali,.back .jaali{opacity:0}
.b-wrap{display:flex;align-items:center;gap:4.6mm;height:100%}
.b-qr{flex:none;width:23mm;height:23mm;background:#FFFDF8;padding:1.3mm;border-radius:.8mm}
.b-qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
.b-tx{flex:1;color:var(--maroon);min-width:0}
.b-tx .lead{font-family:'Yatra One',cursive;font-size:10.5pt;line-height:1.45;word-spacing:.3em;color:var(--maroon);margin-bottom:1.9mm;letter-spacing:.008em}
.b-tx .lead em{font-style:normal;color:var(--maroon)}
.b-tx .sm{font-family:'Mukta',sans-serif;font-size:6.6pt;line-height:1.62;color:#6b3a40}
.b-tx .sm .hl{color:var(--maroon);font-weight:600}
.ig,.web{display:inline-flex;align-items:center;gap:1.1mm;vertical-align:-0.35mm}
.ig svg,.web svg{width:2.9mm;height:2.9mm;flex:none;display:block}
.b-div{height:.2mm;background:rgba(122,31,43,.32);margin:1.8mm 0}
.b-addr{font-family:'Mukta',sans-serif;font-size:6.4pt;line-height:1.55;color:#70434a}
</style></head><body>
